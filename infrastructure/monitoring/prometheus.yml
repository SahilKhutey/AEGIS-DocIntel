# AEGIS-DocIntel Prometheus Monitoring Configuration
# PROT-FINAL-05: Workstream DEP-09

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'evaluation-gateway'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['evaluation-gateway:8000']
    relabel_configs:
      - target_label: environment
        replacement: production

  - job_name: 'private-engine'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['private-engine:8000']
    relabel_configs:
      - target_label: environment
        replacement: production
