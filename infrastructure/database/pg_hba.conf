# AEGIS-DocIntel PostgreSQL Host-Based Authentication Configuration
# PROT-FINAL-05: Workstream DEP-04 & DEP-06
# Reject all external / public evaluator connections.
# Allow only authorized containers on internal docker bridge subnets.

# TYPE  DATABASE        USER            ADDRESS                 METHOD
local   all             all                                     trust
host    all             all             127.0.0.1/32            scram-sha-256
host    all             all             ::1/128                 scram-sha-256

# Private engine and gateway internal network subnets
host    aegis_production aegis_app       172.16.0.0/12           scram-sha-256
host    aegis_production aegis_migration 172.16.0.0/12           scram-sha-256
host    aegis_production aegis_readonly  172.16.0.0/12           scram-sha-256

# Reject everything else explicitly
host    all             all             all                     reject
