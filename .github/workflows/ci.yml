name: CI

on:
  push:
    branches:
      - master
      - main
      - "p0/**"
      - "p1/**"
      - "p4/**"
      - fix/phase0-green-and-honest
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch: {}

# Least privilege. pull-requests:read is needed by gitleaks-action to enumerate PR commits.
permissions:
  contents: read
  pull-requests: read

# Superseded runs on the same ref are cancelled (never on canonical master pushes).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  RUNNER: ubuntu-24.04

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Dependencies and docs must match their sources of truth
        run: |
          python scripts/check_dependency_sync.py
          python scripts/check_docs_claims.py
      - name: Install lint tooling
        run: pip install ruff
      - name: Ruff (style/correctness)
        run: ruff check src tests scripts dashboard

  test:
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install core + dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-core.txt -r requirements-dev.txt

      - name: Verify OpenAPI spec is up to date
        run: |
          python -c "from src.main import app; import json; json.dump(app.openapi(), open('/tmp/openapi_check.json','w'), indent=2)"
          diff -u openapi.json /tmp/openapi_check.json || (echo "openapi.json is stale — regenerate it" && exit 1)

      - name: Run test suite with coverage
        run: |
          pytest tests/ \
            --junitxml=pytest-results.xml \
            --cov=src --cov-report=xml --cov-report=term-missing \
            --cov-fail-under=75

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-results-py${{ matrix.python-version }}
          path: pytest-results.xml
          if-no-files-found: warn

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-py${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: warn

  security:
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # gitleaks scans history; a shallow clone cannot resolve commit ranges
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install core dependencies (scan what actually ships)
        run: pip install -r requirements-core.txt
      - name: Dependency vulnerability scan
        run: |
          pip install pip-audit
          pip-audit --requirement requirements-core.txt
      - name: Static security analysis (bandit)
        run: |
          pip install bandit
          bandit -r src dashboard scripts -ll
      - name: Secret scan
        # Reviewed false positives live in .gitleaksignore, each with an explanatory comment.
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-smoke:
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install build tooling
        run: pip install --upgrade pip build
      - name: Build wheel distribution
        run: python -m build --wheel
      - name: Smoke test installed package
        run: |
          pip install dist/*.whl
          python -c "import src; from src.main import app; print('AEGIS-DocIntel app initialized successfully:', app.title)"

  deployment-security:
    name: Deployment Configuration Security
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Validate deployment configuration
        shell: bash
        run: |
          cat > /tmp/aegis-compose-ci.env <<'EOF'
          AEGIS_IMAGE_TAG=ci-validation
          PROMETHEUS_IMAGE=prom/prometheus:v2.50.1
          GRAFANA_IMAGE=grafana/grafana:10.4.1
          GRAFANA_ADMIN_USER=ci-admin
          GRAFANA_ADMIN_PASSWORD=ci-only-not-a-real-secret
          AEGIS_JWT_ISSUER=https://issuer.example.invalid
          AEGIS_JWT_AUDIENCE=aegis-ci
          AEGIS_JWT_PUBLIC_KEY=ci-placeholder-only
          AEGIS_ALLOW_EXTERNAL_LLM=false
          EOF
          docker compose \
            --env-file /tmp/aegis-compose-ci.env \
            -f deploy/docker-compose.yml \
            config --quiet
