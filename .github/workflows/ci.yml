name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  schedule:
    - cron: "0 6 * * 1"   # weekly, Monday 06:00 UTC — powers dependency-drift-check below
  workflow_dispatch: {}

# Least privilege. pull-requests:read is needed by gitleaks-action to enumerate PR commits.
permissions:
  contents: read
  pull-requests: read

# Superseded runs on the same ref are cancelled (never on master/main pushes — those all run).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Pinned to a fixed image on purpose: `ubuntu-latest` migrates to Ubuntu 26 on 2026-10-19, which would
# silently change the toolchain under every job. Bump deliberately, in a PR that proves it still passes.
env:
  RUNNER: ubuntu-24.04

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Dependencies and docs must match their sources of truth
        run: |
          # pyproject.toml generates requirements-*.txt; docs may not assert unverifiable claims.
          python scripts/check_dependency_sync.py
          python scripts/check_docs_claims.py
      - name: Install lint tooling
        run: pip install ruff mypy
      - name: Ruff (style/correctness)
        run: ruff check src tests scripts
      - name: Mypy (type-check, non-blocking while types are hardened)
        run: mypy src --ignore-missing-imports || true

  test:
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      # Same two files the README tells a new user to install — if this passes, so does their install.
      - name: Install core + dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-core.txt -r requirements-dev.txt

      - name: Verify OpenAPI spec is up to date
        run: |
          python -c "from src.main import app; import json; json.dump(app.openapi(), open('/tmp/openapi_check.json','w'), indent=2)"
          diff -u openapi.json /tmp/openapi_check.json || (echo "openapi.json is stale — regenerate it" && exit 1)

      - name: Run test suite with coverage
        run: |
          # Coverage gate: 70% (baseline) -> 75% (measured ~79%). The whole suite runs — nothing is --ignore'd.
          pytest tests/ \
            --junitxml=pytest-results.xml \
            --cov=src --cov-report=xml --cov-report=term-missing \
            --cov-fail-under=75

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-results-py${{ matrix.python-version }}
          path: pytest-results.xml
          if-no-files-found: warn

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-py${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: warn

  # "README as a test": a brand-new virtualenv following the README's commands verbatim.
  # Exists because the documented install once aborted with zero tests run while CI stayed "fine".
  cold-start:
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    env:
      HF_HUB_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Follow the README verbatim in a fresh virtualenv
        run: scripts/cold_start_check.sh

  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # gitleaks scans history; a shallow clone cannot resolve commit ranges
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install core dependencies (scan what actually ships)
        run: pip install -r requirements-core.txt
      - name: Dependency vulnerability scan
        run: |
          pip install pip-audit
          pip-audit --requirement requirements-core.txt || true
      - name: Static security analysis (bandit)
        run: |
          pip install bandit
          bandit -r src -ll || true
      - name: Secret scan
        # Reviewed false positives live in .gitleaksignore, each with an explanatory comment.
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-drift-check:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Regenerate lock file in a clean, isolated venv and diff
        run: |
          python -m venv /tmp/lockcheck
          /tmp/lockcheck/bin/pip install --upgrade pip
          /tmp/lockcheck/bin/pip install -r requirements-core.txt
          /tmp/lockcheck/bin/pip freeze > requirements-core.lock.new.txt
          diff requirements-core.lock.txt requirements-core.lock.new.txt || true

  performance:
    name: Performance Regression
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Was gated on refs/heads/main, but pushes land on master — so this job could never run.
    # Runs on pushes to either default branch; too slow for every PR.
    if: github.event_name == 'push'
    needs: [test]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install core + dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-core.txt -r requirements-dev.txt
      - name: Run performance regression tests
        run: pytest tests/test_performance.py -v --tb=short -m slow
      - name: Upload timing results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: performance-results
          path: production/benchmark-dataset-real/timing_results.csv
          if-no-files-found: warn
