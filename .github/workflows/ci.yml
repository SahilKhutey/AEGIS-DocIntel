name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  schedule:
    - cron: "0 6 * * 1"   # weekly, Monday 06:00 UTC — powers dependency-drift-check below
  workflow_dispatch: {}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install lint tooling
        run: pip install ruff mypy
      - name: Ruff (style/correctness)
        run: ruff check src tests
      - name: Mypy (type-check, non-blocking while types are hardened)
        run: mypy src --ignore-missing-imports || true

  test:
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install core + dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-core.txt
          pip install -r requirements-dev.txt

      - name: Run test suite with coverage
        run: |
          pytest tests/ --ignore=tests/test_multimodal.py \
            --junitxml=pytest-results.xml \
            --cov=src --cov-report=xml --cov-report=term-missing \
            --cov-fail-under=70

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results-${{ matrix.os }}-py${{ matrix.python-version }}
          path: pytest-results.xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}-py${{ matrix.python-version }}
          path: coverage.xml

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install core dependencies (scan what actually ships)
        run: pip install -r requirements-core.txt
      - name: Dependency vulnerability scan
        run: |
          pip install pip-audit
          pip-audit --requirement requirements-core.txt || true
      - name: Static security analysis (bandit)
        run: |
          pip install bandit
          bandit -r src -ll || true
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-drift-check:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Regenerate lock file in a clean, isolated venv and diff
        run: |
          python -m venv /tmp/lockcheck
          /tmp/lockcheck/bin/pip install --upgrade pip
          /tmp/lockcheck/bin/pip install -r requirements-core.txt
          /tmp/lockcheck/bin/pip freeze > requirements-core.lock.new.txt
          diff requirements-core.lock.txt requirements-core.lock.new.txt || true
