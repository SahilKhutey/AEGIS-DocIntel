name: Core CI

on:
  pull_request:
    branches: [master, main]
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend checks
    uses: ./.github/workflows/backend-ci.yml

  frontend:
    name: Frontend checks
    uses: ./.github/workflows/frontend-ci.yml

  integration:
    name: Integration tests
    needs: [backend, frontend]
    uses: ./.github/workflows/integration-tests.yml

  gate:
    name: Required CI gate
    if: always()
    needs: [backend, frontend, integration]
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs
        env:
          BACKEND: ${{ needs.backend.result }}
          FRONTEND: ${{ needs.frontend.result }}
          INTEGRATION: ${{ needs.integration.result }}
        run: |
          echo "Evaluating CI Gate: Backend=$BACKEND, Frontend=$FRONTEND, Integration=$INTEGRATION"
          test "$BACKEND" = "success"
          test "$FRONTEND" = "success"
          test "$INTEGRATION" = "success"
          echo "All required CI quality gates have passed successfully."
