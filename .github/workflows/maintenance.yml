name: Maintenance

on:
  schedule:
    - cron: "0 6 * * 1"   # weekly, Monday 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read

env:
  RUNNER: ubuntu-24.04

jobs:
  performance:
    name: Performance Regression Benchmarks
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-core.txt -r requirements-dev.txt
      - name: Run performance regression tests
        run: pytest tests/test_performance.py -v --tb=short -m slow
      - name: Upload timing results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: performance-results
          path: production/benchmark-dataset-real/timing_results.csv
          if-no-files-found: warn

  python-compat:
    name: Python 3.13 Compatibility Sweep
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-core.txt -r requirements-dev.txt
      - name: Run test suite on Python 3.13
        run: pytest tests/ --junitxml=pytest-results-py313.xml
      - name: Upload Python 3.13 test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-results-py3.13
          path: pytest-results-py313.xml
          if-no-files-found: warn

  dependency-drift:
    name: Dependency Drift Sweep
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check lockfile drift in clean environment
        run: |
          python -m venv /tmp/lockcheck
          /tmp/lockcheck/bin/pip install --upgrade pip
          /tmp/lockcheck/bin/pip install -r requirements-core.txt
          /tmp/lockcheck/bin/pip freeze > requirements-core.lock.new.txt
          diff -u requirements-core.lock.txt requirements-core.lock.new.txt || (echo "Notice: dependency drift detected against PyPI latest" && exit 1)
