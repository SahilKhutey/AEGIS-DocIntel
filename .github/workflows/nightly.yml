name: Nightly sweep
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  drift:
    name: Drift sweep
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[sweep]"
      - name: Drift sweep
        id: drift
        run: |
          if python tools/sweep_drift.py --json > drift.json; then
            echo "ok=1" >> "$GITHUB_OUTPUT"
          else
            echo "ok=0" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@v4
        with: { name: drift-report, path: drift.json }
      - name: Open PR on new drift
        if: steps.drift.outputs.ok == '0'
        uses: peter-evans/create-pull-request@v6
        with:
          branch: bot/sweep-drift-${{ github.run_id }}
          title: "bot(sweep): drift detected"
          body: "Automated sweep found drift. See drift-report artefact."

  openapi:
    name: OpenAPI <-> gRPC sync
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python tools/sweep_openapi_sync.py

  audit:
    name: Audit chain integrity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e . >/dev/null
      - run: python tools/sweep_audit_integrity.py

  deps:
    name: Dependency CVE sweep
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: pip install pip-audit
      - run: python tools/sweep_dependency_audit.py
