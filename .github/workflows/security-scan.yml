name: Security Scan & Application Hardening

on:
  push:
    branches: [ master, main, remediation/*, audit/* ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-core.lock.txt
          pip install pytest pytest-asyncio anyio bandit pip-audit

      - name: Run Bandit SAST scan
        run: |
          bandit -r src aegis -ll -ii || true

      - name: Run Pip-audit dependency vulnerability scan
        run: |
          pip-audit -r requirements-core.lock.txt || true

      - name: Run Expanded Application Security Tests
        run: |
          pytest tests/security/ -v
