name: AEGIS Audit Infrastructure

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-infrastructure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-core.lock.txt
          pip install pytest pytest-asyncio pytest-cov pyyaml

      - name: Validate configuration
        run: |
          python -m aegis.audit validate --config configs/audit/ci.yaml

      - name: Run infrastructure tests
        run: |
          python -m pytest tests/audit_infrastructure -v

      - name: Execute audit
        run: |
          python -m aegis.audit run --config configs/audit/ci.yaml
