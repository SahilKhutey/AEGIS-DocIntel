version: "1.0.0"
resource_limits:
  max_file_size_bytes: 52428800 # 50 MB
  max_pages: 500
  max_page_dimension_points: 10000.0
  max_image_pixels: 50000000 # 50 Megapixels
  timeout_seconds: 45
  max_memory_mb: 1024
  allowed_mime_types:
    - "application/pdf"
    - "image/png"
    - "image/jpeg"
    - "image/tiff"
  allow_encrypted_without_password: false
