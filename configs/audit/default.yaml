version: "1.0"
audit:
  name: "AEGIS-DocIntel Default Audit"
  enabled: true
  execution:
    mode: "sequential"
    fail_fast: false
    strict: false
    timeout_seconds: 600
    suite_timeout_seconds: 180
    retries: 0
    max_parallel_suites: 1
  suites:
    - id: "unit"
      enabled: true
      required: true
      timeout_seconds: 120
    - id: "integration"
      enabled: true
      required: true
      timeout_seconds: 180
    - id: "security"
      enabled: true
      required: true
      timeout_seconds: 180
    - id: "performance"
      enabled: true
      required: false
      timeout_seconds: 180
  evidence:
    enabled: true
    format: "json"
    validate: true
    retain_artifacts: true
  traceability:
    capture_commit: true
    capture_branch: true
    capture_environment: true
    capture_configuration_hash: true
  reporting:
    generate_json: true
    generate_markdown: true
    include_findings: true
  security:
    redact_secrets: true
    include_environment_values: false
