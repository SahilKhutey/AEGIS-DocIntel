version: "1.0"
audit:
  name: "AEGIS-DocIntel Development Audit"
  enabled: true
  execution:
    mode: "sequential"
    fail_fast: true
    strict: false
    timeout_seconds: 300
    suite_timeout_seconds: 60
    retries: 0
    max_parallel_suites: 1
  suites:
    - id: "unit"
      enabled: true
      required: true
      timeout_seconds: 60
    - id: "integration"
      enabled: false
      required: false
      timeout_seconds: 60
    - id: "security"
      enabled: false
      required: false
      timeout_seconds: 60
    - id: "performance"
      enabled: false
      required: false
      timeout_seconds: 60
  evidence:
    enabled: true
    format: "json"
    validate: false
    retain_artifacts: false
  traceability:
    capture_commit: true
    capture_branch: true
    capture_environment: false
    capture_configuration_hash: true
  reporting:
    generate_json: true
    generate_markdown: false
    include_findings: true
  security:
    redact_secrets: true
    include_environment_values: false
