name: SDK Matrix Build

on:
  push:
    paths:
      - "proto/amdi.proto"
  workflow_dispatch:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: |
          python -m pip install grpcio-tools
          python -m grpc_tools.protoc \
              -I proto -I proto/googleapis \
              --python_out=sdks/python/src/amdi_sdk/proto \
              --grpc_python_out=sdks/python/src/amdi_sdk/proto \
              proto/amdi.proto
      - run: |
          cd sdks/python
          python -m pip install -e .
          pip install pytest
          pytest -q

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: |
          npm i -g grpc-tools
          grpc_tools_node_protoc \
              --js_out=import_style=commonjs:sdks/typescript/src/proto \
              --grpc_out=grpc_js:sdks/typescript/src/proto \
              -I proto proto/amdi.proto
      - run: |
          cd sdks/typescript
          npm ci
          npm run build && npm test

  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: "temurin", java-version: "17" }
      - run: |
          cd sdks/java
          mvn -B -q test

  cpp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: |
          python -m pip install conan
          conan profile detect
          conan install grpc/1.62.0 protobuf/3.25.3 --build=missing
      - run: |
          cd sdks/cpp
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j
