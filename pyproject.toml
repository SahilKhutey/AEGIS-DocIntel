# ─────────────────────────────────────────────────────────────────────────────
# AEGIS-DocIntel / AMDI-OS — Canonical Build & Distribution Configuration
# PEP 621 single-source build. Replaces all legacy packaging files.
# ─────────────────────────────────────────────────────────────────────────────

[build-system]
requires = ["hatchling>=1.22", "hatch-vcs>=0.3"]
build-backend = "hatchling.build"

[project]
name = "amdi-os"
version = "0.3.0.dev0"
description = "Adaptive Mathematical Document Intelligence Operating System — production-grade pre-LLM document intelligence."
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Sahil Khutey", email = "maintainer@example.invalid" },
    { name = "AMDI-OS Development Team" },
]
maintainers = [
    { name = "Sahil Khutey" },
]
keywords = [
    "document-intelligence", "rag", "pre-llm", "knowledge-graphs",
    "vector-search", "topological-data-analysis", "semantic-cache",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: Other/Proprietary License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Indexing",
    "Typing :: Typed",
]
requires-python = ">=3.12"
dependencies = [
    # ── Core numeric / scientific stack ──────────────────────────────────────
    "numpy>=1.26,<3.0",
    "scipy>=1.11",
    "networkx>=3.2",
    "scikit-learn>=1.4",
    "sympy>=1.12",
    # ── PDF / Office / Image parsing ────────────────────────────────────────
    "pymupdf>=1.24",
    "pdfplumber>=0.11",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "python-pptx>=0.6.23",
    "Pillow>=10.2",
    # ── OCR (lazy-imported; only required if scanned PDFs) ──────────────────
    "pytesseract>=0.3.10 ; platform_python_implementation != 'PyPy'",
    "pdf2image>=1.17",
    # ── Speech / Audio ──────────────────────────────────────────────────────
    "librosa>=0.10",
    "soundfile>=0.12",
    # ── Vector search / embeddings ─────────────────────────────────────────
    "sentence-transformers>=2.6",
    "rank-bm25>=0.2.2",
    # ── API / Web layer & Async Queue ───────────────────────────────────────
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-multipart>=0.0.9",
    "arq>=0.25",
    # ── Security / observability ────────────────────────────────────────────
    "PyJWT[crypto]>=2.8",
    "cryptography>=42.0",
    "structlog>=24.1",
    # ── LLM connectors (optional providers individually) ───────────────────
    "httpx>=0.27",
    "tenacity>=8.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "pip-audit>=2.7",
]
docs = [
    "mkdocs>=1.5",
    "mkdocs-material>=9.5",
]
benchmarks = [
    "ragas>=0.1",
    "deepeval>=0.21",
    "pandas>=2.2",
    "matplotlib>=3.8",
]
sweep = [
    "pip-audit>=2.7",
    "httpx>=0.27",
    "pyyaml>=6.0",
]
all = ["amdi-os[dev,docs,benchmarks,sweep]"]

[project.urls]
Homepage = "https://github.com/SahilKhutey/AEGIS-DocIntel"
Documentation = "https://github.com/SahilKhutey/AEGIS-DocIntel/blob/master/docs/"
Source = "https://github.com/SahilKhutey/AEGIS-DocIntel"
Issues = "https://github.com/SahilKhutey/AEGIS-DocIntel/issues"

[project.scripts]
amdi = "amdi.__main__:main"
amdi-api = "amdi.api.cli:main"

# ─────────────────────────────────────────────────────────────────────────────
# Hatch Build Targets
# ─────────────────────────────────────────────────────────────────────────────
[tool.hatch.build.targets.wheel]
packages = ["src/amdi"]
include = [
    "src/amdi/**/*.py",
    "src/amdi/py.typed",
    "README.md",
    "LICENSE",
]

[tool.hatch.build.targets.sdist]
include = [
    "src/amdi",
    "tests",
    "docs",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]

# ─────────────────────────────────────────────────────────────────────────────
# Hatch vcs versioning (single source = git tags)
# ─────────────────────────────────────────────────────────────────────────────
[tool.hatch.version]
source = "vcs"
fallback-version = "0.2.0"

# ─────────────────────────────────────────────────────────────────────────────
# Tool Configuration: ruff (lint + format), mypy, pytest, coverage
# ─────────────────────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["build", "dist", ".venv"]

[tool.ruff.lint]
select = [
    "E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF",
    "ASYNC", "S", "A", "C4", "DTZ", "PIE", "PT", "RET",
    "PL", "TRY", "PERF", "TID", "TCH",
]
ignore = [
    "PLR0913",  # too-many-arguments (engine APIs need many params)
    "TRY003",  # long-message-exception (custom domain exceptions OK)
    "S101",    # assert (we want asserts in tests)
]
unfixable = ["F401"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "PLR2004", "S105", "S106"]
"src/amdi/**/__init__.py" = ["F401"]
"src/amdi/legacy_bridge.py" = ["F401", "B008"]


[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
plugins = ["pydantic.mypy"]
exclude = ["build/", "dist/", ".venv/", "tests/"]

[[tool.mypy.overrides]]
module = ["librosa.*", "soundfile.*", "pdf2image.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = [".", "src"]

addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--showlocals",
    "--tb=short",
    "--cov=amdi",
    "--cov-report=term-missing:skip-covered",
    "--cov-report=xml",
    "--cov-fail-under=70",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: integration tests requiring external services",
    "ocr: tests requiring Tesseract installed",
    "audio: tests requiring audio fixtures",
]
asyncio_mode = "auto"
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:pkg_resources",
    "ignore::PendingDeprecationWarning",
    "ignore::RuntimeWarning:scipy.stats.*",
    "ignore::pytest.PytestUnraisableExceptionWarning",
]



[tool.coverage.run]
branch = true
source = ["amdi"]
omit = [
    "*/tests/*",
    "*/__main__.py",
    "*/legacy_bridge.py",
    "*/_version.py",
]


[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "\\.\\.\\.",
]

[tool.pip-audit]
require-hashes = false
vulnerability-service = "pypi"
