[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-docintel"
version = "0.1.0-alpha.1"
description = "Pre-LLM Mathematical Context Compiler & Document Intelligence Pre-processor"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [
    { name = "Sahil Khutey" }
]
keywords = [
    "document-intelligence",
    "rag",
    "context-engineering",
    "pdf-parser",
    "reading-order-dag",
    "submodular-knapsack",
    "llm-compiler"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: General",
]

dependencies = [
    # ── API ──────────────────────────────────────────────────────────
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "pyyaml>=6.0.1",
    "fastapi>=0.110.0",
    "starlette>=0.36.0",
    "uvicorn[standard]>=0.27.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    # ── Document processing (PDF + Office formats) ───────────────────
    "pymupdf>=1.24.0",
    "pdfplumber>=0.10.0",
    "pillow>=10.2.0",
    "python-docx>=1.1.0",
    "python-pptx>=0.6.23",
    "openpyxl>=3.1.2",
    # ── LLM providers ────────────────────────────────────────────────
    "openai>=1.30.0",
    "anthropic>=0.25.0",
    # ── Math / graph / classical ML (NOT embeddings — see [ml]) ──────
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "networkx>=3.2",
    "scikit-learn>=1.4.0",
    # ── Observability ────────────────────────────────────────────────
    "prometheus-client>=0.20.0",
    "structlog>=24.1.0",
    "loguru>=0.7.2",
    # ── Auth / security ──────────────────────────────────────────────
    "PyJWT[crypto]>=2.9.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.1.0",
    "tiktoken>=0.6.0",
]

[project.optional-dependencies]
# NOTE: requirements-*.txt mirror these groups exactly; tests/test_dependency_sync.py
# (and scripts/check_dependency_sync.py) fail if they drift. pyproject.toml is the
# single source of truth. Upper bounds are intentionally omitted: CI always tests
# the newest releases, a weekly drift job watches for breakage, and
# requirements-core.lock.txt provides a reproducible pin.
ml = [
    "sentence-transformers>=2.7.0",
    "faiss-cpu>=1.7.4",
]
infra = [
    "redis>=5.0.0",
    "opentelemetry-api>=1.24.0",
    "opentelemetry-sdk>=1.24.0",
]
ocr = [
    "pytesseract>=0.3.10",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "hypothesis>=6.98.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "bandit>=1.7.8",
    "pip-audit>=2.7.0",
    "pytesseract>=0.3.10",
]
all = [
    "aegis-docintel[ml,infra,ocr,dev]"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "backend*", "sdk*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = [".", "sdk/python"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]
# Register custom marks — run slow tests explicitly: pytest tests/test_performance.py -m slow
markers = [
    "slow: marks tests as slow performance regression guards (deselect with '-m not slow')",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = [
    "E501",
    "F401",
    "W291",
    "W292",
    "W293",
    "I001",
    "F841",
    "E402",
    "E741",
    "E701",
    "E731",
    "E702",
    "E712",
    "F811",
]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = false
disallow_untyped_defs = false

[tool.coverage.run]
source = ["src"]
omit = ["src/*/tests/*", "*/test_*.py"]
