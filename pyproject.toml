[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-docintel"
version = "0.1.0-alpha.1"
description = "Pre-LLM Mathematical Context Compiler & Document Intelligence Pre-processor"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [
    { name = "Sahil Khutey" }
]
keywords = [
    "document-intelligence",
    "rag",
    "context-engineering",
    "pdf-parser",
    "reading-order-dag",
    "submodular-knapsack",
    "llm-compiler"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: General",
]

dependencies = [
    "pydantic>=2.6.0,<3.0.0",
    "pydantic-settings>=2.2.0,<3.0.0",
    "pyyaml>=6.0.1",
    "fastapi>=0.110.0,<1.0.0",
    "uvicorn[standard]>=0.27.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "starlette>=0.36.0",
    "numpy>=1.26.0,<2.1.0",
    "scipy>=1.12.0,<1.14.0",
    "networkx>=3.2.0,<4.0.0",
    "scikit-learn>=1.4.0,<1.6.0",
    "pymupdf>=1.24.0",
    "pdfplumber>=0.10.0",
    "pillow>=10.2.0",
    "structlog>=24.1.0",
    "loguru>=0.7.2",
    "prometheus-client>=0.20.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.1.0",
    "tiktoken>=0.6.0",
]

[project.optional-dependencies]
ml = [
    "sentence-transformers>=2.7.0",
    "faiss-cpu>=1.7.4",
    "openai>=1.30.0",
    "anthropic>=0.25.0",
    "redis>=5.0.0",
    "opentelemetry-api>=1.24.0",
    "opentelemetry-sdk>=1.24.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "hypothesis>=6.98.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
    "bandit>=1.7.8",
    "pip-audit>=2.7.0",
    "safety>=3.1.0",
]
all = [
    "aegis-docintel[ml,dev]"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "backend*", "sdk*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]
# Register custom marks — run slow tests explicitly: pytest tests/test_performance.py -m slow
markers = [
    "slow: marks tests as slow performance regression guards (deselect with '-m not slow')",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = [
    "E501",
    "F401",
    "W291",
    "W292",
    "W293",
    "I001",
    "F841",
    "E402",
    "E741",
    "E701",
    "E731",
    "E702",
    "E712",
    "F811",
]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = false
disallow_untyped_defs = false

[tool.coverage.run]
source = ["src"]
omit = ["src/*/tests/*", "*/test_*.py"]
