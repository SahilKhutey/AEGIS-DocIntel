[build-system]
requires = ["hatchling>=1.22"]
build-backend = "hatchling.build"

[project]
name = "amdi-sdk"
version = "0.2.0"
description = "Python SDK for AEGIS-DocIntel — sync + async gRPC client"
requires-python = ">=3.10"
dependencies = [
    "grpcio>=1.62",
    "grpcio-tools>=1.62",
    "protobuf>=4.25",
]

[project.optional-dependencies]
aio = ["grpc-aio"]

[tool.hatch.build.targets.wheel]
packages = ["src/amdi_sdk"]
