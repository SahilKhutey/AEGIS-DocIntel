limit_req_zone $binary_remote_addr zone=aegis_api:10m rate=10r/s;

server {
    listen 80;
    server_name api.example.com;

    # Do not serve application content over plaintext HTTP.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name api.example.com;

    ssl_certificate /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;

    client_max_body_size 200m;
    client_body_timeout 60s;
    send_timeout 60s;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;

    # Metrics must not be exposed through this public virtual host.
    location = /metrics {
        return 404;
    }

    location / {
        limit_req zone=aegis_api burst=20 nodelay;
        proxy_pass http://aegis-api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}
