limit_req_zone $binary_remote_addr zone=aegis_api:10m rate=15r/s;

server {
    listen 80;
    server_name _;

    # Redirect all plaintext traffic to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;

    client_max_body_size 200m;
    client_body_timeout 60s;
    send_timeout 60s;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;

    # Metrics must never be exposed publicly
    location = /metrics {
        return 404;
    }

    # Operational Health Probe
    location = /health {
        proxy_pass http://aegis-api:8000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # API Routing
    location ~ ^/(api|v1)/ {
        limit_req zone=aegis_api burst=25 nodelay;
        proxy_pass http://aegis-api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # WebSocket progress notifications
    location /v1/query/ws {
        proxy_pass http://aegis-api:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # Web Workbench (Next.js)
    location / {
        proxy_pass http://aegis-web:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
