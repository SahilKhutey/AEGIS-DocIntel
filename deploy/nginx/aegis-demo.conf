limit_req_zone $binary_remote_addr zone=demo_rate_limit:10m rate=20r/s;

server {
    listen 80;
    server_name _;

    client_max_body_size 25m;
    client_body_timeout 30s;
    send_timeout 30s;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer-when-downgrade always;
    add_header X-Frame-Options DENY always;
    server_tokens off;

    # Operational metrics must NEVER be publicly exposed
    location = /metrics {
        return 404;
    }

    # Direct Health Check Probe
    location = /health {
        proxy_pass http://aegis-api:8000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # API Routing (Backend FastAPI)
    location ~ ^/(api|v1)/ {
        limit_req zone=demo_rate_limit burst=30 nodelay;
        proxy_pass http://aegis-api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # WebSocket progress notifications
    location /v1/query/ws {
        proxy_pass http://aegis-api:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # Frontend Workbench (Next.js)
    location / {
        proxy_pass http://aegis-web:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
