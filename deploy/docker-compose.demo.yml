version: '3.8'

# =================================================================
# AEGIS-DocIntel — Product Hunt Live Demo Edition (Docker Compose)
# =================================================================
# Usage:
#   docker-compose -f deploy/docker-compose.demo.yml up --build -d
#
# Services:
#   - aegis-web: Next.js Document Intelligence Workbench UI
#   - aegis-api: FastAPI backend with demo sandbox mode and preloaded corpus
#   - nginx: Unified ingress routing with rate limiting and secure headers
# =================================================================

services:
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${DEMO_PORT:-80}:80"
    volumes:
      - ./nginx/aegis-demo.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - aegis-web
      - aegis-api
    networks:
      - demo-network

  aegis-web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    image: aegis-web:demo
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      INTERNAL_API_URL: http://aegis-api:8000
      NEXT_PUBLIC_AEGIS_DEMO_MODE: "true"
      NEXT_PUBLIC_API_BASE_URL: ""
    networks:
      - demo-network
    depends_on:
      aegis-api:
        condition: service_healthy
    mem_limit: 1g
    cpus: 1.0

  aegis-api:
    build:
      context: ..
      dockerfile: Dockerfile
    image: aegis-docintel:demo
    restart: unless-stopped
    init: true
    environment:
      AEGIS_ENVIRONMENT: demo
      AEGIS_DEMO_MODE: "true"
      AEGIS_DEMO_ALLOW_ANONYMOUS: "true"
      AEGIS_DEMO_TOKEN: "aegis-demo-token-sandbox"
      AEGIS_DEMO_API_KEY: "aegis-demo-public-key"
      AEGIS_SQLITE_PATH: /app/data/demo_documents.db
      AEGIS_AUDIT_LOG_PATH: /app/data/demo_audit.log
      AEGIS_ENABLE_DOCS: "false"
      AEGIS_LOG_LEVEL: INFO
      AEGIS_ALLOW_EXTERNAL_LLM: "false"
      TIKTOKEN_CACHE_DIR: /tmp/tiktoken
      CORS_ORIGINS: '["http://localhost","http://localhost:3000","http://127.0.0.1:3000"]'
    volumes:
      - demo-data:/app/data
      - ../demo/seed:/app/demo/seed:ro
      - ../demo/scripts:/app/demo/scripts:ro
    networks:
      - demo-network
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g
    cpus: 2.0
    healthcheck:
      test:
        - CMD
        - curl
        - -fsS
        - http://127.0.0.1:8000/health
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    # Seed the demo dataset on startup if not already seeded
    command: >
      sh -c "python demo/scripts/seed_demo.py || true &&
             python -m uvicorn src.main:app --host 0.0.0.0 --port 8000"

networks:
  demo-network:
    driver: bridge

volumes:
  demo-data:
    driver: local
