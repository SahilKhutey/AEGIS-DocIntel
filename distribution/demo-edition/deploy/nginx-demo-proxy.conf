events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # Rate limiting for evaluation client endpoints
    limit_req_zone $binary_remote_addr zone=eval_limit:10m rate=30r/m;

    upstream web_upstream {
        server web:3000;
    }

    server {
        listen 80;
        server_name localhost;

        client_max_body_size 10M;

        # Security Headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Frontend Application
        location / {
            proxy_pass http://web_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }

        # Secure Evaluation API Routing
        location /api/ {
            # Evaluation Gateway routing
            # Passes evaluation token and client metadata securely
            proxy_pass ${AEGIS_GATEWAY_URL:-http://gateway:8000}/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Block internal admin endpoints
            location ~* /api/v[0-9]+/admin {
                return 403 '{"error": "FORBIDDEN", "message": "Administrative interfaces are disabled in the Evaluation Edition."}';
            }
        }

        # Health probe endpoint
        location /health {
            access_log off;
            return 200 '{"status": "healthy", "edition": "AEGIS-DocIntel-Demo-Edition"}';
            add_header Content-Type application/json;
        }
    }
}
